[project]
name = "fluidstab-trainer"
version = "0.0.0"
description = "fluid-stabilizer RL trainer / policy server (no Unity dependency; talks over TCP)"
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.24",
    "torch>=2.1",
    "tensorboard>=2.14",
]

[tool.uv]
# 스크립트 모음이지 설치할 패키지가 아니다.
package = false
# 시스템/python.org Python 에 기대지 않고 uv 가 관리하는 Python 만 쓴다.
python-preference = "only-managed"
